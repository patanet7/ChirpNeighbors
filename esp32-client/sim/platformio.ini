; Real ESP32-S3 machine code with synthetic PCM and UART0 diagnostics.
; Does not call unsupported microphone, Wi-Fi or RGB LED peripherals.
[platformio]
src_dir = .
boards_dir = ../boards
default_envs = qemu-protocol

[env:qemu-protocol]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
build_src_filter = +<protocol_selftest.cpp>
build_src_flags = -Wall -Wextra -Werror -Wformat=2 -Wshadow
