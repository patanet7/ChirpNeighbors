; Test-only boundary adapters around the unchanged production main.cpp.
[platformio]
src_dir = .
boards_dir = ../boards
libdeps_dir = ../.pio/libdeps
default_envs = qemu-control

[env:qemu-control]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
build_src_filter = +<control_selftest.cpp>
build_src_flags = -Wall -Wextra -Werror -Wformat=2 -Wshadow
build_flags = -I../include
lib_deps =
    links2004/WebSockets@2.7.1
    ESP32Async/AsyncTCP@3.3.2
    ESP32Async/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit NeoPixel@1.12.5
