[platformio]
default_envs = esp32-s3-devkitc-1-n16r8v

[env:esp32-s3-devkitc-1-n16r8v]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@2.7.1
    ESP32Async/AsyncTCP@3.3.2
    ESP32Async/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit NeoPixel@1.12.5
build_flags =
    -DWEBSOCKETS_TCP_TIMEOUT=100
build_src_flags = -Wall -Wextra -Werror -Wformat=2 -Wshadow
check_tool = cppcheck
check_skip_packages = yes
check_flags = cppcheck: --enable=warning,performance,portability --inline-suppr -DPROGMEM= --suppress=*:*.pio/libdeps/*

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -Wshadow -pedantic
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = no
