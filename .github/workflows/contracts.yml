name: Portable yard contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-inference/requirements-contract.txt
      - run: python -m pip install -r requirements-contract.txt
      - run: python -m unittest discover -s tests -p 'test_*contract.py' -v
