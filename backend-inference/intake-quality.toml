# Standalone firmware intake gates deliberately exclude optional API/ML modules.
# The repository's existing strict backend authority remains pyproject.toml.
[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = [
  "app/main.py",
  "app/services/audio_packet.py",
  "app/services/audio_capture.py",
  "app/services/stream_handler.py",
  "scripts/check_intake.py",
  "tests/test_audio_ingestion.py",
  "tests/test_audio_server.py",
  "tests/test_firmware_wire.py",
]

[tool.coverage.run]
branch = true
source = [
  "app.main",
  "app.services.audio_packet",
  "app.services.audio_capture",
  "app.services.stream_handler",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
