<!doctype html><meta charset="utf-8"><title>San Diego plants batch03</title><style>body{font:18px system-ui;background:#e6e2d5;color:#273b3b;max-width:1200px;margin:40px auto}img{max-width:100%}select{font:inherit;padding:10px;margin:10px}canvas{background:#35464b;image-rendering:pixelated}</style><h1>Lemonadeberry and California fuchsia</h1><p>Independent seasonal overlays on unchanged standing bases. Interactive static review; no animation or wind simulation.</p><label>Lemonadeberry<select id="l" onchange="draw()"><option value="0">Vegetative</option><option value="1">Flowers</option><option value="2">Fruit</option></select></label><label>California fuchsia<select id="f" onchange="draw()"><option value="3">Vegetative</option><option value="4">Flowers</option><option value="5">Seed capsules</option></select></label><canvas id="c" width="960" height="540"></canvas><img src="review/san-diego-batch03-contact.png"><p>Per-flower attachment rigs and final-size botanical review remain open. Faint alpha-1 overlay residue is documented.</p><script>let ctx=c.getContext('2d'),names=['lemonadeberry-base','lemonadeberry-flower-overlay','lemonadeberry-fruit-overlay','california-fuchsia-base','california-fuchsia-flower-overlay','california-fuchsia-seed-overlay'],ims=names.map(n=>{let i=new Image;i.src='runtime/'+n+'.png';return i});function draw(){ctx.clearRect(0,0,960,540);ctx.imageSmoothingEnabled=false;ctx.drawImage(ims[0],70,30,430,430);if(+l.value)ctx.drawImage(ims[+l.value],70,30,430,430);ctx.drawImage(ims[3],520,30,400,400);if(+f.value>3)ctx.drawImage(ims[+f.value],520,30,400,400)}Promise.all(ims.map(i=>new Promise(r=>i.onload=r))).then(draw);</script>
