<!doctype html><meta charset="utf-8"><title>San Diego plant batch02 review</title><style>body{font:18px system-ui;background:#e6e2d5;color:#273b3b;max-width:1200px;margin:40px auto}img{max-width:100%}button{font:inherit;margin:10px;padding:10px}canvas{background:#35464b;image-rendering:pixelated}</style><h1>San Diego plant batch 02</h1><p>Candidate review only. Sage needs root cleanup; deergrass reproductive attempts were rejected; dudleya needs style and stalk-attachment review.</p><button onclick="spent=!spent;draw()">Toggle sage spent flowers</button><button onclick="flower=!flower;draw()">Toggle dudleya flower layer</button><canvas id="c" width="960" height="540"></canvas><img src="review/san-diego-batch02-contact.png"><p>Static states only; no wind animation or runtime admission.</p><script>let spent=false,flower=true,ctx=c.getContext('2d'),names=['cleveland-sage-flowering','cleveland-sage-spent','deergrass-vegetative','chalk-dudleya-rosette','chalk-dudleya-flower-overlay'],ims=names.map(n=>{let i=new Image;i.src='runtime/'+n+'.png';return i});function draw(){ctx.clearRect(0,0,960,540);ctx.imageSmoothingEnabled=false;ctx.drawImage(ims[spent?1:0],50,50,300,300);ctx.drawImage(ims[2],350,50,300,300);ctx.drawImage(ims[3],650,50,300,300);if(flower)ctx.drawImage(ims[4],650,50,300,300)}Promise.all(ims.map(i=>new Promise(r=>i.onload=r))).then(draw);</script>
